[package]
name = "kdetokurva"
version = "0.1.0"
edition = "2024"

[dependencies]
geojson = "0.24.2"
geo = "0.30.0"
rand = "0.9.0"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5.0", features = ["fs"] }
reqwest = { version = "0.12.15", features = ["rustls-tls"] }
directories = "5.0"
